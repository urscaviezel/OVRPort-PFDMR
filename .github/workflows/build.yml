name: Windows source build
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - name: Install pinned NDK
        run: sdkmanager 'ndk;27.2.12479018'
      - name: Build ARM64 wrapper
        run: python native/build_native.py --ndk "$env:ANDROID_HOME/ndk/27.2.12479018" --tests
      - name: Build desktop JAR
        run: ./gradlew.bat :composeApp:packageUberJarForCurrentOS :composeApp:dependencyInventory --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: windows-jar
          path: composeApp/build/compose/jars/*.jar
          retention-days: 14
